  <path d="M0 860c200-70 330 50 520 20s280-110 470-80 260 100 430 60 130-40 180-30v370H0Z" fill="url(#hero-hill-b)" />
  <path d="M0 1020c220-50 360 40 560 10s300-80 500-50 250 70 400 40 110-20 140-10v190H0Z" fill="#100D2A" />
  <circle cx="1180" cy="260" r="130" fill="#FFFFFF" opacity="0.1" />
